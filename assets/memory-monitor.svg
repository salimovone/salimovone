<text x="40" y="138" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#8391b3">How much private memory is Notepad using right now?</text>
<text x="40" y="162" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#8391b3">A Windows performance counter knows — this reads it in MB.</text>
<text x="40" y="206" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="12" fill="#55617f">→ salimovone/ProcessResourceMonitor</text>
